name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: hunter-ci-secret-at-least-32-characters-long
      JWT_EXPIRES_IN: 1d
      NODE_ENV: test
      DEMO_MODE: 'false'
      HUNTER_SCHEDULER_ENABLED: 'false'
      NEXT_PUBLIC_API_URL: http://localhost:3333/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @hunter/flight-api db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
